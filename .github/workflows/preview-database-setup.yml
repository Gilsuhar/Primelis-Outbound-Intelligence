name: One-time Preview Prisma initialization

on:
  # The verified owner's deliberate setup-tag publication authorizes this one-time operation.
  # No branch push, PR, schedule or default-branch registration is involved.
  push:
    tags:
      - 'agent-workforce-preview-setup-txfxfrlhtvzwgluhnbpw-*'

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-workforce-preview-setup-txfxfrlhtvzwgluhnbpw
  cancel-in-progress: false

jobs:
  initialize:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Gilsuhar/Primelis-Outbound-Intelligence' &&
      github.repository_id == '1299364799' &&
      github.repository_owner_id == '79252537' &&
      github.actor_id == '79252537' &&
      github.actor == 'Gilsuhar' &&
      github.triggering_actor == 'Gilsuhar' &&
      github.event.sender.id == 79252537 &&
      github.event.sender.type == 'User' &&
      github.ref == format('refs/tags/agent-workforce-preview-setup-txfxfrlhtvzwgluhnbpw-{0}', github.sha) &&
      github.run_attempt == 1 &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: agent-workforce-preview-setup
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install frozen dependencies without lifecycle scripts
        env:
          CHECKPOINT_DISABLE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {reviewedFiles} from './scripts/preview/verification.mjs'; reviewedFiles(JSON.parse(readFileSync('scripts/preview/verified-target.json')).migrations);"
          npm install --global pnpm@9.12.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/prisma/build/index.js generate
      - name: Validate owner authorization, plan, TLS and identity; initialize and verify
        env:
          PREVIEW_SETUP_DATABASE_URL: ${{ secrets.PREVIEW_SETUP_DATABASE_URL }}
          PREVIEW_SETUP_APPROVED_ENDPOINT: ${{ vars.PREVIEW_SETUP_APPROVED_ENDPOINT }}
          PREVIEW_SETUP_APPROVED_SHA: ${{ vars.PREVIEW_SETUP_APPROVED_SHA }}
          PREVIEW_SETUP_ENVIRONMENT: agent-workforce-preview-setup
          PREVIEW_SETUP_PROJECT_NAME: agent-workforce-preview
          PREVIEW_SETUP_APPROVED_PROJECT_REF: txfxfrlhtvzwgluhnbpw
          PREVIEW_SETUP_APPROVAL: initialize:txfxfrlhtvzwgluhnbpw
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
          CHECKPOINT_DISABLE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node scripts/preview/setup.mjs --plan
          node scripts/preview/setup.mjs --execute-approved-initialization
