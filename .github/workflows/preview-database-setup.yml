name: One-time Preview administrative schema audit

on:
  # Retain the deployment-excluded namespace; no initialization or schema writes.
  # Only the owner's deliberate creation of the SHA-named branch may authorize this audit.
  # Ordinary branch pushes, updates, tags, PRs, schedules and reruns cannot authorize this job.
  push:
    branches:
      - 'codex/preview-migration-txfxfrlhtvzwgluhnbpw-*'

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-workforce-preview-setup-txfxfrlhtvzwgluhnbpw
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Gilsuhar/Primelis-Outbound-Intelligence' &&
      github.repository_id == '1299364799' &&
      github.repository_owner_id == '79252537' &&
      github.actor_id == '79252537' &&
      github.actor == 'Gilsuhar' &&
      github.triggering_actor == 'Gilsuhar' &&
      github.event.sender.id == 79252537 &&
      github.event.sender.type == 'User' &&
      github.ref_type == 'branch' &&
      github.ref == format('refs/heads/codex/preview-migration-txfxfrlhtvzwgluhnbpw-{0}', github.sha) &&
      github.run_attempt == 1 &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: agent-workforce-preview-setup
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install frozen dependencies without lifecycle scripts
        env:
          CHECKPOINT_DISABLE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {reviewedFiles} from './scripts/preview/verification.mjs'; reviewedFiles(JSON.parse(readFileSync('scripts/preview/verified-target.json')).migrations);"
          npm install --global pnpm@9.12.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/prisma/build/index.js generate
      - name: Audit existing schema with read-only queries and explicitly approved privileged Prisma diff
        env:
          PREVIEW_SETUP_DATABASE_URL: ${{ secrets.PREVIEW_SETUP_DATABASE_URL }}
          PREVIEW_SETUP_APPROVED_ENDPOINT: ${{ vars.PREVIEW_SETUP_APPROVED_ENDPOINT }}
          PREVIEW_SETUP_APPROVED_SHA: ${{ vars.PREVIEW_SETUP_APPROVED_SHA }}
          PREVIEW_SETUP_PUSH_CREATED: ${{ github.event.created }}
          PREVIEW_SETUP_PUSH_DELETED: ${{ github.event.deleted }}
          PREVIEW_SETUP_PUSH_FORCED: ${{ github.event.forced }}
          PREVIEW_SETUP_PUSH_BEFORE: ${{ github.event.before }}
          PREVIEW_SETUP_ENVIRONMENT: agent-workforce-preview-setup
          PREVIEW_SETUP_PROJECT_NAME: agent-workforce-preview
          PREVIEW_SETUP_APPROVED_PROJECT_REF: txfxfrlhtvzwgluhnbpw
          PREVIEW_SETUP_APPROVAL: audit-admin:txfxfrlhtvzwgluhnbpw
          PREVIEW_ADMIN_DIFF_APPROVAL: privileged-read-only-prisma-diff
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
          CHECKPOINT_DISABLE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node scripts/preview/audit-admin.mjs --plan
          node scripts/preview/audit-admin.mjs --audit-with-prisma-diff
