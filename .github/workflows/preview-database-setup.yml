name: One-time Preview SALES_USER profile binding

on:
  # Retain the deployment-excluded namespace; only the reviewed profile/policy transaction.
  # Only the owner's deliberate creation of the SHA-named branch may authorize this binding.
  # Ordinary branch pushes, updates, tags, PRs, schedules and reruns cannot authorize this job.
  push:
    branches:
      - 'codex/preview-migration-txfxfrlhtvzwgluhnbpw-*'

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-workforce-preview-setup-txfxfrlhtvzwgluhnbpw
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Gilsuhar/Primelis-Outbound-Intelligence' &&
      github.repository_id == '1299364799' &&
      github.repository_owner_id == '79252537' &&
      github.actor_id == '79252537' &&
      github.actor == 'Gilsuhar' &&
      github.triggering_actor == 'Gilsuhar' &&
      github.event.sender.id == 79252537 &&
      github.event.sender.type == 'User' &&
      github.ref_type == 'branch' &&
      github.ref == format('refs/heads/codex/preview-migration-txfxfrlhtvzwgluhnbpw-{0}', github.sha) &&
      github.run_attempt == 1 &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: agent-workforce-preview-setup
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Prepare digest-pinned PostgreSQL client without database credentials
        run: |
          docker pull --platform=linux/amd64 postgres@sha256:2cd2c0f809604aaeff6f0ec8f40aecbd025613107561015c69369a1a7f1d3416
      - name: Bind only the approved SALES_USER profile and independently verify
        env:
          PREVIEW_SETUP_DATABASE_URL: ${{ secrets.PREVIEW_SETUP_DATABASE_URL }}
          PREVIEW_SETUP_APPROVED_ENDPOINT: ${{ vars.PREVIEW_SETUP_APPROVED_ENDPOINT }}
          PREVIEW_SETUP_APPROVED_SHA: ${{ vars.PREVIEW_SETUP_APPROVED_SHA }}
          PREVIEW_SETUP_PUSH_CREATED: ${{ github.event.created }}
          PREVIEW_SETUP_PUSH_DELETED: ${{ github.event.deleted }}
          PREVIEW_SETUP_PUSH_FORCED: ${{ github.event.forced }}
          PREVIEW_SETUP_PUSH_BEFORE: ${{ github.event.before }}
          PREVIEW_SETUP_ENVIRONMENT: agent-workforce-preview-setup
          PREVIEW_SETUP_PROJECT_NAME: agent-workforce-preview
          PREVIEW_SETUP_APPROVED_PROJECT_REF: txfxfrlhtvzwgluhnbpw
          PREVIEW_SETUP_APPROVAL: bind-profile:txfxfrlhtvzwgluhnbpw
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
          CHECKPOINT_DISABLE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node scripts/preview/bind-profile.mjs --plan
          node scripts/preview/bind-profile.mjs --bind-profile
